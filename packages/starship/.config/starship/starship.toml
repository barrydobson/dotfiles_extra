"$schema" = 'https://starship.rs/config-schema.json'

palette = "voltaic_dark"
format = """[╭╴](volt)$os$username$hostname$directory $fill\
$git_branch\
$git_commit\
$git_state\
$git_status\
$kubernetes\
$golang\
$cmd_duration\
$status\
$container
$character
"""
add_newline = false

command_timeout = 3000

[fill]
symbol = ' '
style = ''

[character]
success_symbol = "[╰⎯](volt)"
error_symbol = "[╰⎯](ember)"
# ╭╴ ╰─

[status]
disabled = false
format = '[//](subtle) [$symbol$common_meaning$signal_name$maybe_int](bold ember) '
symbol = ' '

[os]
format = '[$symbol](bold arc) '
disabled = false

[os.symbols]
Windows = ' '
Ubuntu = ''
Macos = '󰀵'
Unknown = '󰠥'

# Shows the username
[username]
style_user = 'bold arc'
style_root = 'bold ember'
format = '[//](subtle) [$user]($style) '
disabled = false
show_always = false

# Shows the hostname
[hostname]
ssh_only = true
format = '[//](subtle) [$hostname](bold violet) '
disabled = false

# Shows current directory
[directory]
# truncation_length = 0
truncation_symbol = '…/'
home_symbol = '~'
read_only = '  '
format = '[//](subtle) [$path]($style)[$read_only]($read_only_style) '
style = 'blue'
read_only_style = 'ember'

# Shows current git branch
[git_branch]
symbol = ' '
format = '[//](subtle) [$symbol\[$branch\](:$remote_branch)]($style) '
# truncation_length = 0
# truncation_symbol = '…/'
style = 'bold arc'

# Shows current git status
[git_status]
disabled = false
format = '([$all_status$ahead_behind]($style) )'
style = 'bold amber'
conflicted = ' 🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](jade)'
renamed = ' '
deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
symbol = ' '
format = '[//](subtle) [$symbol$context](bold blue) '
disabled = false
# contexts = []

[aws]
format = '[//](subtle) [$symbol$profile]($style)'
disabled = false
style = 'bold amber'
symbol = " "

[golang]
format = '[//](subtle) [$symbol($version )]($style) '
symbol = ' '
style = 'bold teal'

[docker_context]
disabled = true

[helm]
disabled = true

[python]
symbol = '󰌠'
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
format = '[//](subtle) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '
style = 'bold amber'

[nodejs]
disabled = false
format = '[//](subtle) [$symbol($version )](bold arc)'

[terraform]
disabled = true

[custom.claude]
detect_files = ["CLAUDE.md"]
detect_folders = [".claude"]
symbol = ""
format = '[//](subtle) [$symbol Claude](bronze) '

