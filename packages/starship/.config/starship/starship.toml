"$schema" = 'https://starship.rs/config-schema.json'

format = """[╭╴](lime)$os$username$hostname$directory $fill\
$git_branch\
$git_commit\
$git_state\
$git_status\
$kubernetes\
$golang\
$cmd_duration\
$status\
$container
$character
"""
add_newline = false
palette = "voltaic_dark"

command_timeout = 3000

[fill]
symbol = ' '
style = ''

[character]
success_symbol = "[╰⎯](lime)"
error_symbol = "[╰⎯](red)"
# ╭╴ ╰─

[status]
disabled = false
format = '[//](surface2) [$symbol$common_meaning$signal_name$maybe_int](bold red) '
symbol = ' '

[os]
format = '[$symbol](bold text lime) '
disabled = false

[os.symbols]
Windows = ' '
Ubuntu = ''
Macos = '󰀵'
Unknown = '󰠥'

# Shows the username
[username]
style_user = 'bold lime_dim'
style_root = 'bold red'
format = '[//](surface2) [$user]($style) '
disabled = false
show_always = false

# Shows the hostname
[hostname]
ssh_only = true
format = '[//](surface2) [$hostname](bold mauve) '
disabled = false

# Shows current directory
[directory]
# truncation_length = 0
truncation_symbol = '…/'
home_symbol = '~'
read_only = '  '
format = '[//](surface2) [$path]($style)[$read_only]($read_only_style) '
style = 'blue'
read_only_style = 'red'

# Shows current git branch
[git_branch]
symbol = ' '
format = '[//](surface2) [$symbol\[$branch\](:$remote_branch)]($style) '
# truncation_length = 0
# truncation_symbol = '…/'
style = 'bold lime'

# Shows current git status
[git_status]
disabled = false
format = '([$all_status$ahead_behind]($style) )'
style = 'bold yellow'
conflicted = ' 🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](lime)'
renamed = ' '
deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
symbol = ' '
format = '[//](surface2) [$symbol$context](bold blue) '
disabled = false
# contexts = []

[aws]
format = '[//](surface2) [$symbol$profile]($style)'
disabled = false
style = 'bold peach'
symbol = " "

[golang]
format = '[//](surface2) [$symbol($version )]($style) '
symbol = ' '
style = 'bold teal'

[docker_context]
disabled = true

[helm]
disabled = true

[python]
symbol = '󰌠'
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
format = '[//](surface2) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '
style = 'bold yellow'

[nodejs]
disabled = false
format = '[//](surface2) [$symbol($version )](bold lime_dim)'

[terraform]
disabled = true

[custom.claude]
detect_files = ["CLAUDE.md"]
detect_folders = [".claude"]
symbol = ""
format = '[//](surface2) [$symbol Claude](#d97757) '

# Matches packages/k9s/.config/k9s/skins/voltaic-dark.yaml
[palettes.voltaic_dark]
lime = "#caea28"
lime_dim = "#a3e635"
teal = "#73daca"
blue = "#7aa2f7"
mauve = "#bb9af7"
yellow = "#e0af68"
peach = "#f59e0b"
red = "#f7768e"
text = "#fafafa"
surface2 = "#52525b"
