dialect = "uk"

auto_sync = false
update_check = false

# In a git repo, default the filter to that repo's history
workspaces = true

# Up-arrow walks this shell's history; Ctrl-R searches everything
filter_mode_shell_up_key_binding = "session"

# Leading space keeps a command out of the database
history_filter = ["^ "]

inline_height = 10
show_preview = true
show_help = false
show_tabs = false

secrets_filter = true

enter_accept = false

[dotfiles]
enabled = false
